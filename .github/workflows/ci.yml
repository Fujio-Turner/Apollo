name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same ref to save Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Python lint — ruff, scoped to the "real bug" rule families so the
  # check stays green on the existing codebase while still blocking
  # genuine problems on incoming PRs.
  #
  #   E9   — syntax errors
  #   F63  — invalid `==` / `is` comparisons
  #   F7   — keyword-position errors (e.g. `break` outside loop)
  #   F82  — undefined name (catches typos and missing imports)
  #
  # Style/format rules (E501, ruff-format, etc.) are intentionally
  # **not** enforced here yet — there are ~170 pre-existing style
  # findings and ~260 files that would be reformatted. Tighten this
  # ruleset in a follow-up once the bulk reformat is committed.
  # ──────────────────────────────────────────────────────────────────
  lint:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install --upgrade ruff

      - name: ruff check (errors only)
        run: |
          ruff check . \
            --select E9,F63,F7,F82 \
            --exclude venv \
            --exclude .venv \
            --exclude env \
            --exclude __pycache__ \
            --exclude .pytest_cache \
            --exclude htmlcov \
            --exclude target \
            --exclude _dev_only \
            --exclude build \
            --exclude dist \
            --exclude .apollo \
            --exclude .graph_search

      # Informational pass: surfaces the full ruff report (style, unused
      # imports, etc.) in the job log without failing the build. Use this
      # to track cleanup progress before promoting rules into the gating
      # step above. `|| true` ensures non-zero ruff exit doesn't fail CI.
      - name: ruff check (full report, non-blocking)
        run: |
          ruff check . \
            --exclude venv --exclude .venv --exclude env \
            --exclude __pycache__ --exclude .pytest_cache --exclude htmlcov \
            --exclude target --exclude _dev_only --exclude build \
            --exclude dist --exclude .apollo --exclude .graph_search \
            --statistics || true

  # ──────────────────────────────────────────────────────────────────
  # License header check — every first-party Python file must declare
  # `SPDX-License-Identifier: BUSL-1.1` in its top-of-file comment block.
  # ──────────────────────────────────────────────────────────────────
  license-check:
    name: BSL-1.1 license headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify SPDX BUSL-1.1 header on every .py file
        run: python3 scripts/check_license_headers.py
